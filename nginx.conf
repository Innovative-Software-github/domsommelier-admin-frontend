# Внутренний nginx контейнера админки: отдаёт статическую SPA-сборку и
# проксирует /api-back на бэкенд (в проде роль vite dev-прокси играет он).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 — встроенный DNS docker-compose. Резолвим через переменную,
    # а не статическим хостом в proxy_pass — иначе если domsommelier-app ещё
    # не поднялся (или перезапускался) в момент старта/reload nginx, он падает
    # насмерть с "host not found in upstream" вместо того чтобы просто отдать 502.
    resolver 127.0.0.11 valid=10s;

    location /api-back/ {
        # ВАЖНО: set — до rewrite ... break. Флаг break останавливает
        # обработку ВСЕХ директив rewrite-модуля в этом location (а set —
        # тоже директива rewrite-модуля), поэтому если поставить set после
        # rewrite ... break, он просто не выполнится и proxy_pass получит
        # пустую переменную ("using uninitialized variable" в логах).
        set $backend_upstream http://domsommelier-app:8080;
        rewrite ^/api-back/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
